<!doctype html>
<html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Eja Jobs</title>
<meta name="description" content="Punë ditore, javore dhe mujore në Kosovë. Firmat postojnë, punëtorët aplikojnë.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light dark;--bg:#F6F3EA;--surface:#FFF;--ink:#0B2A21;--muted:#4F645B;--line:#DDD8C8;--brand:#0B3B2D;--brand2:#082A20;--on-brand:#F6F3EA;--signal:#F28C28;--signal-ink:#2A1500;--gold:#B8620C;--ok:#0E7A4D;--ok-bg:#DCF2E6;--bad:#B3261E;--bad-bg:#FBE0DC;--fd:Poppins,system-ui,sans-serif;--fb:"Instrument Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#07201A;--surface:#0F2A22;--ink:#F6F3EA;--muted:#B5C7BE;--line:#23423A;--gold:#FFB45E;--ok-bg:#12382B;--ok:#6FD3A4;--bad-bg:#40201C;--bad:#FF9D94;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 96px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;margin-bottom:18px}
header .right{display:flex;align-items:center;gap:6px;min-width:0}
.logo{display:block;line-height:0}.logo svg{height:30px;width:auto}
.lg-ink{fill:var(--ink)}.lg-gold{fill:var(--signal)}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:2px}
.lang button{font:600 13px var(--fb);border:0;background:none;color:var(--muted);border-radius:999px;padding:6px 9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
h1{font-family:var(--fd);font-weight:800;font-size:clamp(32px,7vw,60px);line-height:1.04;letter-spacing:-.035em;margin:14px 0 12px;text-wrap:balance}
h2{font-family:var(--fd);font-weight:700;font-size:clamp(24px,4vw,34px);letter-spacing:-.025em;margin:0 0 14px;text-wrap:balance}
h3{font-family:var(--fd);font-size:18px;margin:0 0 4px}
section{margin:0 0 44px}
p{margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:14px}
.btn{font:600 16px var(--fb);border:0;border-radius:12px;padding:12px 18px;min-height:46px;background:var(--signal);color:var(--signal-ink);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.who{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;font:600 15px var(--fb);cursor:pointer;padding:6px}
.hero{background:radial-gradient(700px 420px at 100% 0%,rgba(242,140,40,.28),transparent 60%),linear-gradient(160deg,var(--brand),var(--brand2));color:var(--on-brand);border-radius:28px;padding:clamp(20px,4vw,44px);display:grid;gap:24px}
@media(min-width:860px){.hero{grid-template-columns:1.25fr 1fr;align-items:center}}
.hero p{color:#C9D6CE;font-size:clamp(16px,2vw,19px);max-width:30em}
.promo{display:inline-block;border:1.5px solid rgba(242,140,40,.6);background:rgba(242,140,40,.14);color:#FFC98A;font-weight:600;font-size:14px;border-radius:999px;padding:6px 14px}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px;font-weight:600;margin-top:6px}
.ask{font-family:var(--fd);font-weight:700;font-size:18px;margin:0 0 10px}
.bigs{display:grid;gap:10px}
.big{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;text-align:left;background:#fff;color:#0B2A21;border:0;border-radius:18px;padding:12px 16px 12px 12px;cursor:pointer;font:inherit}
.big svg{width:100%;height:auto;display:block;border-radius:12px}
.big b{font-family:var(--fd);font-size:18px;display:block;line-height:1.2}.big small{color:#4F645B;font-size:14px}
.stupill{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;padding:6px 13px;font:600 14px var(--fb);color:var(--gold);background:transparent;border:1.5px solid var(--signal);border-radius:999px;cursor:pointer}
.stupill[aria-pressed="true"]{background:var(--signal);color:var(--signal-ink)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(min-width:900px){.tiles{grid-template-columns:repeat(6,1fr);gap:13px}}
.tile{display:grid;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 10px;cursor:pointer;text-align:center;font:inherit;color:var(--ink)}
.tile svg{width:100%;height:auto;display:block;border-radius:11px}
.tile b{font-family:var(--fd);font-size:13px;font-weight:600;line-height:1.2}
.tile[aria-pressed="true"]{border-color:var(--signal);box-shadow:0 0 0 2px var(--signal)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 16px var(--fb);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 18px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
@media (prefers-color-scheme:dark){.chip[aria-pressed="true"],.lang button[aria-pressed="true"]{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.role{font-family:var(--fd);font-weight:700;font-size:18px}
.pay{font-family:var(--fd);font-weight:700;font-size:22px;white-space:nowrap}.pay small{font:500 13px var(--fb);color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--ok-bg);color:var(--ok);margin:0 6px 4px 0}
.tag.o{background:var(--signal);color:var(--signal-ink)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.n{background:transparent;border:1px solid var(--line);color:var(--muted)}
.rate{color:var(--gold);font-weight:600;font-size:14px;white-space:nowrap}
label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;font:500 17px var(--fb);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:500;color:var(--ink)}.chk input{width:22px;height:22px}
.msg{border-radius:12px;padding:10px 14px;margin:12px 0;font-weight:500}.msg.err{background:var(--bad-bg);color:var(--bad)}.msg.ok{background:var(--ok-bg);color:var(--ok)}
.person{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.steps{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px;counter-reset:s;display:grid}
@media(min-width:800px){.steps{grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,auto);grid-auto-flow:column;column-gap:32px}}
.step{position:relative;padding:12px 0 12px 44px;border-top:1px solid var(--line);counter-increment:s}
.step:first-child{border-top:0}
@media(min-width:800px){.step:nth-child(4){border-top:0}}
.step::before{content:counter(s);position:absolute;left:0;top:13px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--signal);color:var(--signal-ink);font:700 14px var(--fd)}
.step h3{font-size:16px;margin:0}
.step p{margin:0;font-size:14px;color:var(--muted)}
.cols{display:grid;gap:12px}@media(min-width:700px){.cols{grid-template-columns:1fr 1fr}}@media(min-width:960px){#pricing .cols{grid-template-columns:repeat(3,1fr)}}
.plan{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.plan:first-of-type{border-top:0}.plan .pay{font-size:28px}
details.faq{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px}
details.faq summary{font-weight:600;font-size:17px;cursor:pointer}
details.faq p{margin:10px 0 0;color:var(--muted)}
.code{display:inline-block;font:700 28px/1 ui-monospace,monospace;letter-spacing:.2em;background:var(--ok-bg);color:var(--ink);border-radius:12px;padding:12px 16px;margin-top:4px}
.attrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.attrow input{width:110px;text-align:center;letter-spacing:.15em}
.stars{display:flex;gap:6px;margin:6px 0}.stars button{font-size:34px;line-height:1;background:none;border:0;color:var(--line);cursor:pointer;padding:2px}.stars button[aria-pressed="true"]{color:var(--signal)}
footer{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:14px}
a{color:inherit}
dialog{border:0;border-radius:20px;padding:22px;width:min(440px,calc(100vw - 24px));background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.helpbtn{position:fixed;right:16px;bottom:16px;z-index:6;width:58px;height:58px;border-radius:50%;border:0;background:var(--signal);color:var(--signal-ink);cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
#helpDlg{padding:0;width:min(440px,calc(100vw - 24px));max-height:min(640px,calc(100vh - 24px))}
.hwrap{display:flex;flex-direction:column;max-height:inherit}
.hhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.hlog{padding:14px 18px;overflow-y:auto;display:grid;gap:10px;flex:1;min-height:120px}
.hm{border-radius:14px;padding:10px 14px;max-width:88%;white-space:pre-line}
.hm.b{background:var(--ok-bg);justify-self:start}.hm.u{background:var(--signal);color:var(--signal-ink);justify-self:end}
.hq{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:0 18px 10px;scrollbar-width:none}.hq::-webkit-scrollbar{display:none}.hq button{flex:none}
.hq button{font:600 13px var(--fb);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
#fHelp{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}#fHelp input{flex:1;min-width:0}
.ico .ib{fill:var(--ic-bg)}.ico g{stroke:var(--ic)}.ico .io{stroke:var(--signal)}.ico .ia{fill:var(--signal);stroke:none}.ico .if{fill:var(--signal);stroke:none}
:root{--ic-bg:#E3EDE6;--ic:#0B3B2D}
@media (prefers-color-scheme:dark){:root{--ic-bg:#163A2F;--ic:#F6F3EA}}
.big{--ic-bg:#E3EDE6;--ic:#0B3B2D}
.pwrow{display:flex;gap:6px;align-items:center}.pwrow input{flex:1;min-width:0}
.citysel{width:auto;font:600 16px var(--fb);padding:10px 14px}.citysel.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
@media (prefers-color-scheme:dark){.citysel.on{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f1f1f;border:1.5px solid #747775}
details.more>summary{list-style:none;cursor:pointer}details.more>summary::-webkit-details-marker{display:none}
.skills{display:flex;flex-wrap:wrap;gap:6px}.skills label{margin:0;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--ink);font-weight:600;cursor:pointer}.skills input{width:18px;height:18px}
textarea{width:100%;font:500 17px var(--fb);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:84px}

async function boot(){
  var s=await db.auth.getSession(); me=s.data.session?s.data.session.user:null;
  if(me) await loadProfile();
  if(me&&el("dlg").open&&!el("fNewPw")) el("dlg").close();
  if(me&&profile&&profile.role==="worker"&&pendingApply){ var id=pendingApply; pendingApply=null; savePending(); await apply(id); return; }
  render();
}
db.auth.onAuthStateChange(function(ev,session){
  if(ev==="PASSWORD_RECOVERY"){ setTimeout(openNewPw,400); }
  if(!manual&&ev==="SIGNED_IN"&&session&&(!me||me.id!==session.user.id)){ setTimeout(function(){ boot(); },0); }
});
async function loadProfile(){
  var r=await db.from("profiles").select("*").eq("id",me.id).maybeSingle();
  profile=r.data||null; myPhone=null; myCon={}; myDet={};
  if(profile){
    var c=await db.from("contacts").select("*").eq("id",me.id).maybeSingle(); myCon=c.data||{}; myPhone=myCon.phone||null;
    if(profile.role==="worker"){ var d=await db.from("worker_details").select("*").eq("id",me.id).maybeSingle(); myDet=d.data||{}; }
  }
}

  var r=await db.from("jobs").insert({owner:me.id,job_role:el("jr").value,city:el("jc").value,job_type:el("jt").value,when_text:el("jw").value.trim(),pay:parseFloat(el("jp").value)||0,unit:el("ju").value,spots:parseInt(el("js").value,10)||1,student:el("jst").checked,urgent:el("jug").checked});
  btn.disabled=false;
  if(r.error){ msg(el("m3"),errText(r.error)); return; }
  renderAccount();
}

function openReview(job,target,name){
  el("dlgBody").innerHTML='<h2 style="margin-top:0">'+esc(t("rev_title"))+esc(name)+'</h2><form id="fRev" data-job="'+esc(job)+'" data-target="'+esc(target)+'">'+
    '<label>'+esc(t("stars_q"))+'</label><div class="stars" id="stars" data-v="5">'+[1,2,3,4,5].map(function(n){return '<button type="button" data-star="'+n+'" aria-pressed="true" aria-label="'+n+'">★</button>';}).join("")+'</div>'+
    '<label for="rc">'+esc(t("comment"))+'</label><input id="rc" maxlength="200" placeholder="'+esc(t("comment_ph"))+'">'+
    '<div id="m5"></div><div class="row" style="margin-top:14px"><button class="btn" type="submit">'+esc(t("send_rev"))+'</button><button class="link" type="button" data-act="close">'+esc(t("close"))+'</button></div></form>';
  el("dlg").showModal();
}
async function sendReview(f,btn){
  btn.disabled=true;
  var r=await db.from("reviews").insert({job_id:f.getAttribute("data-job"),author_id:me.id,target_id:f.getAttribute("data-target"),stars:parseInt(el("stars").getAttribute("data-v"),10)||5,comment:el("rc").value.trim()||null});
  btn.disabled=false;
  if(r.error&&!/duplicate key/i.test(r.error.message)){ msg(el("m5"),errText(r.error)); return; }
  el("dlg").close(); renderAccount();
}

 {k:"apply",kw:["apliko","aplikoj","aplikim","apply","kerkoj pune"],q:["Si aplikoj për punë?","How do I apply?"],a:["Te \"Punët e hapura\" shtyp \"Apliko\" te puna që të pëlqen. Nëse nuk ke llogari, hapet në atë çast. Statusin e sheh te emri yt lart, te \"Aplikimet e mia\".","Under \"Open jobs\" tap \"Apply\" on the job you like. If you have no account, it is created on the spot. See the status under your name, in \"My applications\"."]},

 {k:"code",kw:["kod","ardhj","code","arrival"],q:["Çfarë është kodi i ardhjes?","What is the arrival code?"],a:["Punëtori i pranuar sheh një kod me 4 shifra te \"Aplikimet e mia\". Kur mbërrin në punë ia tregon firmës. Firma e shkruan dhe shtyp \"Konfirmo ardhjen\". Kështu mbetet e shënuar që punëtori erdhi.","An accepted worker sees a 4-digit code in \"My applications\". On arrival they show it to the firm, who types it and taps \"Confirm arrival\". This records that the worker showed up."]},

var HT={title:["Ndihmë","Help"],hello:["Përshëndetje! Zgjidh një pyetje më poshtë ose shkruaje vetë.","Hi! Pick a question below or type your own."],ph:["Shkruaj pyetjen…","Type your question…"],send:["Dërgo","Send"],none:["Nuk e gjeta përgjigjen për këtë. Provo një nga pyetjet më poshtë, ose na shkruaj te @eja.jobs.","I couldn't find an answer to that. Try one of the questions below, or message us at @eja.jobs."]};
function ht(k){ return HT[k][lang==="en"?1:0]; }
function norm(x){ return String(x||"").toLowerCase().replace(/ë/g,"e").replace(/ç/g,"c"); }
function helpAdd(text,who){ var d=document.createElement("div"); d.className="hm "+who; d.textContent=text; el("hLog").appendChild(d); el("hLog").scrollTop=el("hLog").scrollHeight; }
function openHelp(){
  var i=lang==="en"?1:0;
  el("hTitle").textContent=ht("title"); el("hClose").textContent=t("close"); el("hIn").placeholder=ht("ph"); el("hSend").textContent=ht("send");
  el("hQ").innerHTML=HELP.map(function(h){ return '<button type="button" data-help="'+h.k+'">'+esc(h.q[i])+'</button>'; }).join("");
  el("hLog").innerHTML=""; helpAdd(ht("hello"),"b"); el("helpDlg").showModal();
}
function helpAnswer(key,typed){
  var i=lang==="en"?1:0, h=null;
  if(key){ h=HELP.filter(function(x){return x.k===key;})[0]; helpAdd(h.q[i],"u"); }
  else { helpAdd(typed,"u"); var n=norm(typed), best=0; HELP.forEach(function(x){ var sc=0; x.kw.forEach(function(w){ if(n.indexOf(norm(w))>=0) sc+=norm(w).length; }); if(sc>best){ best=sc; h=x; } }); }
  helpAdd(h?h.a[i]:ht("none"),"b");
}

document.addEventListener("submit",function(e){
  e.preventDefault(); var f=e.target, b=f.querySelector('button[type="submit"]');
  if(f.id==="fNewPw") saveNewPw(b);
  else if(f.id==="fEmail") signIn(el("em").value.trim(),el("pw").value,b);
  else if(f.id==="fProf") saveProfile(b);
  else if(f.id==="fJob") postJob(b);
  else if(f.id==="fPhone") savePhone(b);
  else if(f.id==="fRev") sendReview(f,b);
  else if(f.id==="fHelp"){ var hv=el("hIn").value.trim(); if(hv){ el("hIn").value=""; helpAnswer(null,hv); } }
});
document.addEventListener("input",function(e){ if(e.target.id==="q"){ fQ=e.target.value; showAll=false; renderBoard(); } });
document.addEventListener("change",function(e){ if(e.target.id==="pr"&&el("rf")) el("rf").innerHTML=roleFields(e.target.value); if(e.target.id==="citySel"){ fCity=e.target.value||"all"; showAll=false; renderBoard(); return; } if(e.target.id==="pr"&&el("pnl")) el("pnl").textContent=L(NAMELBL[e.target.value]); });
document.addEventListener("click",async function(e){
  var lb=e.target.closest(".lang button"); if(lb){ lang=lb.getAttribute("data-lang"); try{localStorage.setItem("eja-lang",lang);}catch(x){} render(); return; }
  var c=e.target.closest("[data-city]"); if(c){ fCity=c.getAttribute("data-city"); showAll=false; renderBoard(); return; }
  var ct=e.target.closest("[data-cat]"); if(ct){ var v0=ct.getAttribute("data-cat"); fCat=(v0===fCat?"all":v0); showAll=false; renderBoard(); if(ct.classList.contains("tile")&&fCat!=="all") el("board").scrollIntoView(); return; }
  if(e.target.closest("[data-stu]")){ fStu=!fStu; showAll=false; renderBoard(); if(fStu) el("board").scrollIntoView(); return; }
  var hb=e.target.closest("[data-help]"); if(hb){ helpAnswer(hb.getAttribute("data-help")); return; }
  var g=e.target.closest("[data-go]"); if(g){ go(g.getAttribute("data-go")); return; }
  if(e.target.closest("#home")){ e.preventDefault(); view="home"; render(); window.scrollTo(0,0); return; }
  var st=e.target.closest("[data-star]"); if(st){ var v=parseInt(st.getAttribute("data-star"),10); el("stars").setAttribute("data-v",v); el("stars").querySelectorAll("button").forEach(function(x,i){ x.setAttribute("aria-pressed",i<v?"true":"false"); }); return; }
  var a=e.target.closest("[data-act]"); if(!a) return;
  var k=a.getAttribute("data-act"), id=a.getAttribute("data-id");
  if(k==="showpw"){ var pi=el(a.getAttribute("data-for")), sh=pi.type==="password"; pi.type=sh?"text":"password"; a.textContent=t(sh?"hide":"show"); return; }
  if(k==="forgot"){ forgot(a); return; }
  if(k==="google"){ googleIn(a); return; }
  if(k==="editprof"){ editing=true; render(); window.scrollTo(0,0); return; }
  if(k==="canceledit"){ editing=false; render(); return; }
  if(k==="help") openHelp();
  else if(k==="helpclose") el("helpDlg").close();
  else if(k==="login") openLogin();
  else if(k==="close") el("dlg").close();
  else if(k==="logout"){ me=null; await db.auth.signOut(); profile=null; view="home"; render(); }
  else if(k==="account"){ view="account"; render(); window.scrollTo(0,0); }
  else if(k==="home"){ view="home"; render(); }
  else if(k==="more"){ showAll=true; renderBoard(); }
  else if(k==="apply"){ a.disabled=true; await apply(id); }
  else if(k==="setapp"){ a.disabled=true; var r=await db.from("applications").update({status:a.getAttribute("data-st")}).eq("id",id); if(r.error) alertBox(errText(r.error)); renderAccount(); }
  else if(k==="withdraw"){ a.disabled=true; var r2=await db.from("applications").delete().eq("id",id); if(r2.error) alertBox(errText(r2.error)); renderAccount(); }
  else if(k==="review") openReview(a.getAttribute("data-job"),a.getAttribute("data-target"),a.getAttribute("data-name"));
  else if(k==="arrive"){ var inp=a.parentNode.querySelector("input"); a.disabled=true; var r5=await db.rpc("confirm_arrival",{app:id,try_code:(inp.value||"").trim()}); a.disabled=false; if(r5.error) alertBox(errText(r5.error)); else if(!r5.data) alertBox(t("code_bad")); else renderAccount(); }
  else if(k==="noshow"){
    if(a.getAttribute("data-sure")!=="1"){ a.setAttribute("data-sure","1"); a.textContent=t("noshow2"); return; }
    a.disabled=true; var r4=await db.from("noshows").insert({job_id:a.getAttribute("data-job"),worker_id:a.getAttribute("data-worker")}); if(r4.error&&!/duplicate key/i.test(r4.error.message)) alertBox(errText(r4.error)); renderAccount(); }
  else if(k==="deljob"){
    if(a.getAttribute("data-sure")!=="1"){ a.setAttribute("data-sure","1"); a.textContent=t("del2"); return; }
    a.disabled=true; var r3=await db.from("jobs").delete().eq("id",id); if(r3.error) alertBox(errText(r3.error)); renderAccount(); }
});
boot().catch(function(e){ el("main").innerHTML='<div class="msg err">'+esc(errText(e))+'</div>'; });
