<style>
:root{--bg:#F6F3EA;--surface:#FFF;--ink:#0B2A21;--muted:#4F645B;--line:#DDD8C8;--brand:#0B3B2D;--signal:#F28C28;--signal-ink:#2A1500;--ok:#0E7A4D;--ok-bg:#DCF2E6;--bad:#B3261E;--bad-bg:#FBE0DC;--fd:Poppins,system-ui,sans-serif;--fb:"Instrument Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#07201A;--surface:#0F2A22;--ink:#F6F3EA;--muted:#B5C7BE;--line:#23423A;--brand:#F6F3EA;--ok-bg:#12382B;--ok:#6FD3A4;--bad-bg:#40201C;--bad:#FF9D94;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;margin-bottom:20px}
.lg-ink{fill:var(--ink)}.lg-gold{fill:var(--signal)}
h1{font-family:var(--fd);font-size:clamp(28px,6vw,44px);line-height:1.08;letter-spacing:-.03em;margin:8px 0 6px}
h2{font-family:var(--fd);font-size:22px;letter-spacing:-.02em;margin:28px 0 12px}
p{margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:14px}
.btn{font:600 16px var(--fb);border:0;border-radius:12px;padding:12px 18px;min-height:46px;background:var(--signal);color:var(--signal-ink);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;font:600 15px var(--fb);cursor:pointer;padding:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.role{font-family:var(--fd);font-weight:700;font-size:18px}
.pay{font-family:var(--fd);font-weight:700;font-size:22px;white-space:nowrap}.pay small{font:500 13px var(--fb);color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--ok-bg);color:var(--ok);margin-right:6px}
.tag.o{background:var(--signal);color:var(--signal-ink)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.n{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;font:600 15px var(--fb);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--bg);border-color:var(--brand)}
label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;font:500 17px var(--fb);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:500;color:var(--ink)}.chk input{width:22px;height:22px}
.msg{border-radius:12px;padding:10px 14px;margin:12px 0;font-weight:500}.msg.err{background:var(--bad-bg);color:var(--bad)}.msg.ok{background:var(--ok-bg);color:var(--ok)}
.person{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
dialog{border:0;border-radius:20px;padding:22px;width:min(440px,calc(100vw - 24px));background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
[hidden]{display:none!important}

async function boot(){
  var s=await db.auth.getSession(); me=s.data.session?s.data.session.user:null;
  if(me) await loadProfile();
  if(me&&profile&&profile.role==="worker"&&pendingApply){ var id=pendingApply; pendingApply=null; savePending(); await apply(id); return; }

}
db.auth.onAuthStateChange(function(ev,session){
  if(ev==="SIGNED_IN"&&session&&(!me||me.id!==session.user.id)){ setTimeout(function(){ boot(); },0); }
});
async function loadProfile(){
  var r=await db.from("profiles").select("*").eq("id",me.id).maybeSingle();
  profile=r.data||null;
}
function renderAuth(){
  el("auth").innerHTML=me
    ? (profile?'<button class="btn alt sm" data-act="account">'+esc(profile.name)+'</button>':'')+'<button class="link" data-act="logout">Dil</button>'
    : '<button class="btn sm" data-act="login">Hyr ose regjistrohu</button>';
}
async function render(){
  renderAuth();
  if(me&&!profile) return renderProfileForm();
  if(view==="account"&&me) return renderAccount();
  return renderBoard();
}

async function renderBoard(){
  var m=el("main");
  m.innerHTML='<h1>Punë për sot, për javën, për muajin.</h1><p class="muted">Zgjidh qytetin dhe apliko.</p>'+

    '<button class="chip" data-stu="1" aria-pressed="'+fStu+'">Për studentë</button>';
  var q=db.from("jobs").select("*, firm:profiles(name)").eq("active",true).order("urgent",{ascending:false}).order("created_at",{ascending:false}).limit(100);

  if(fStu) q=q.eq("student",true);
  var r=await q, mine={};
  if(!el("list")) return;
  if(r.error){ msg(el("list"),errText(r.error)); return; }
  if(me&&profile&&profile.role==="worker"){
    var a=await db.from("applications").select("job_id,status").eq("worker_id",me.id);
    (a.data||[]).forEach(function(x){mine[x.job_id]=x.status;});
    if(!el("list")) return;
  }
  if(!r.data.length){ el("list").innerHTML='<div class="card"><p class="role">Ende asnjë punë këtu.</p><p class="muted">Bëhu i pari që poston një punë, ose provo një qytet tjetër.</p></div>'; return; }
  el("list").innerHTML=r.data.map(function(j){
    var own=me&&j.owner===me.id, st=mine[j.id];
    var btn=own?'<span class="tag n">Puna jote</span>'
      :st?'<span class="tag'+(st==="rejected"?" bad":"")+'">'+esc(STAT[st])+'</span>'
      :(profile&&profile.role!=="worker")?'':'<button class="btn" data-act="apply" data-id="'+j.id+'">Apliko</button>';
    return '<div class="card"><div class="row"><div><div class="role">'+esc(ROLE[j.job_role]||j.job_role)+'</div>'+
      '<div class="muted small">'+esc((j.firm&&j.firm.name)||"")+' · '+esc(CITY[j.city]||j.city)+' · '+esc(j.when_text)+'</div></div>'+
      '<div class="pay">'+esc(Number(j.pay))+' <small>'+esc(UNIT[j.unit]||"")+'</small></div></div>'+
      '<div class="row" style="margin-top:12px"><div><span class="tag o">'+esc(TYPE[j.job_type]||"")+'</span>'+(j.urgent?'<span class="tag bad">Urgjente</span>':'')+(j.student?'<span class="tag">Për studentë</span>':'')+'<span class="tag n">'+esc(j.spots)+' vende</span></div>'+btn+'</div></div>';
  }).join("");
}

/* ---------- Hyrja me kod në email ---------- */
function openLogin(){
  el("dlgBody").innerHTML='<h2 style="margin-top:0">Hyr ose regjistrohu</h2><p class="muted">Shkruaj email-in. Të dërgojmë një link për të hyrë. Pa fjalëkalim.</p>'+
    '<form id="fEmail"><label for="em">Email-i yt</label><input id="em" type="email" required autocomplete="email" placeholder="emri@gmail.com">'+
    '<div id="m1"></div><div class="row" style="margin-top:14px"><button class="btn" type="submit">Më dërgo linkun</button><button class="link" type="button" data-act="close">Mbyll</button></div></form>';
  el("dlg").showModal();
}
async function sendCode(email,btn){
  btn.disabled=true; savePending();
  var r=await db.auth.signInWithOtp({email:email,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}});
  btn.disabled=false;
  if(r.error){ msg(el("m1"),errText(r.error)); return; }
  el("dlgBody").innerHTML='<h2 style="margin-top:0">Shiko email-in</h2><p>Dërguam një link te <strong>'+esc(email)+'</strong>.</p><p class="muted">Hape email-in dhe shtyp linkun. Do të kthehesh këtu i kyçur. Shiko edhe te Spam.</p>'+
    '<div class="row" style="margin-top:14px"><button class="btn" type="button" data-act="close">Në rregull</button><button class="link" type="button" data-act="login">Ndrysho email-in</button></div>';
}

/* ---------- Profili ---------- */
function renderProfileForm(){
  el("main").innerHTML='<h1>Kush je ti?</h1><p class="muted">Vetëm kjo, dhe je gati.</p><form id="fProf" class="card">'+
    '<label for="pr">Unë jam</label><select id="pr">'+opts(ROLENAME,pendingApply?"worker":"firm")+'</select>'+
    '<label for="pn">Emri (ose emri i firmës)</label><input id="pn" required maxlength="60" autocomplete="name">'+
    '<label for="pc">Qyteti</label><select id="pc">'+opts(CITY,"pr")+'</select>'+
    '<div id="m2"></div><button class="btn" type="submit" style="margin-top:16px">Ruaj dhe vazhdo</button></form>';
}
async function saveProfile(btn){
  btn.disabled=true;
  var r=await db.from("profiles").insert({id:me.id,role:el("pr").value,name:el("pn").value.trim(),city:el("pc").value}).select().single();
  btn.disabled=false;
  if(r.error){ msg(el("m2"),errText(r.error)); return; }
  profile=r.data;
  if(pendingApply&&profile.role==="worker"){ var id=pendingApply; pendingApply=null; savePending(); view="account"; await apply(id); return; }
  else { pendingApply=null; savePending(); view=profile.role==="worker"?"board":"account"; }
  render();
}

/* ---------- Aplikimi ---------- */
async function apply(id){
  if(!me){ pendingApply=id; savePending(); openLogin(); return; }
  if(!profile){ pendingApply=id; savePending(); render(); return; }
  var r=await db.from("applications").insert({job_id:id,worker_id:me.id});
  if(r.error&&!/duplicate key/i.test(r.error.message)){ alertBox(errText(r.error)); return; }
  render();
}
function alertBox(text){ el("dlgBody").innerHTML='<p>'+esc(text)+'</p><button class="btn" data-act="close">Në rregull</button>'; el("dlg").showModal(); }

/* ---------- Llogaria ---------- */
async function renderAccount(){
  var m=el("main");
  m.innerHTML='<p class="muted small">Llogaria · '+esc(ROLENAME[profile.role])+'</p><h1>'+esc(profile.name)+'</h1><p><button class="link" data-act="board">Kthehu te punët</button></p><div id="acc"><p class="muted">Duke u ngarkuar…</p></div>';
  if(profile.role==="worker") return renderMyApps();
  var r=await db.from("jobs").select("*, applications(id,status,worker:profiles(name,city))").eq("owner",me.id).order("created_at",{ascending:false});
  if(!el("acc")) return;
  var form='<h2>Posto një punë</h2><form id="fJob" class="card">'+
    '<label for="jr">Çfarë pune</label><select id="jr">'+opts(ROLE,"waiter")+'</select>'+
    '<label for="jw">Kur</label><input id="jw" required maxlength="80" placeholder="E shtunë · 18:00–24:00">'+
    '<div class="two"><div><label for="jp">Paga</label><input id="jp" type="number" min="0" step="0.5" required value="7"></div><div><label for="ju">Njësia</label><select id="ju">'+opts(UNIT,"h")+'</select></div></div>'+
    '<div class="two"><div><label for="jc">Qyteti</label><select id="jc">'+opts(CITY,profile.city||"pr")+'</select></div><div><label for="js">Sa persona</label><input id="js" type="number" min="1" max="50" required value="1"></div></div>'+
    '<label for="jt">Lloji</label><select id="jt">'+opts(TYPE,"d")+'</select>'+
    '<label class="chk"><input type="checkbox" id="jst"> E përshtatshme për studentë</label>'+
    '<label class="chk"><input type="checkbox" id="jug"> Urgjente</label>'+
    '<div id="m3"></div><button class="btn" type="submit" style="margin-top:16px">Posto</button></form>';
  var list;
  if(r.error) list='<div class="msg err">'+esc(errText(r.error))+'</div>';
  else if(!r.data.length) list='<p class="muted">Ende nuk ke postuar asnjë punë.</p>';
  else list=r.data.map(function(j){
    var ap=j.applications||[];
    return '<div class="card"><div class="row"><div><div class="role">'+esc(ROLE[j.job_role]||j.job_role)+'</div><div class="muted small">'+esc(CITY[j.city]||j.city)+' · '+esc(j.when_text)+' · '+esc(Number(j.pay))+' '+esc(UNIT[j.unit]||"")+'</div></div>'+
      '<button class="btn danger sm" data-act="deljob" data-id="'+j.id+'">Fshij</button></div>'+
      '<p class="small muted" style="margin:10px 0 0">Aplikues: '+ap.length+'</p>'+
      ap.map(function(a){
        return '<div class="person row"><div><strong>'+esc((a.worker&&a.worker.name)||"Punëtor")+'</strong> <span class="muted small">'+esc((a.worker&&CITY[a.worker.city])||"")+'</span><br><span class="tag'+(a.status==="rejected"?" bad":a.status==="pending"?" n":"")+'">'+esc(STAT[a.status])+'</span></div>'+
          (a.status==="pending"?'<div><button class="btn sm" data-act="setapp" data-id="'+a.id+'" data-st="accepted">Prano</button> <button class="btn alt sm" data-act="setapp" data-id="'+a.id+'" data-st="rejected">Refuzo</button></div>':'')+'</div>';
      }).join("")+'</div>';
  }).join("");
  el("acc").innerHTML=form+'<h2>Shpalljet e mia</h2>'+list;
}
async function renderMyApps(){
  var r=await db.from("applications").select("id,status,job:jobs(job_role,city,when_text,pay,unit,firm:profiles(name))").eq("worker_id",me.id).order("created_at",{ascending:false});
  if(!el("acc")) return;
  var h='<h2>Aplikimet e mia</h2>';
  if(r.error) h+='<div class="msg err">'+esc(errText(r.error))+'</div>';
  else if(!r.data.length) h+='<p class="muted">Ende nuk ke aplikuar. Kthehu te punët dhe shtyp Apliko.</p>';
  else h+=r.data.map(function(a){ var j=a.job||{};
    return '<div class="card"><div class="row"><div><div class="role">'+esc(ROLE[j.job_role]||j.job_role||"")+'</div><div class="muted small">'+esc((j.firm&&j.firm.name)||"")+' · '+esc(CITY[j.city]||"")+' · '+esc(j.when_text||"")+' · '+esc(Number(j.pay))+' '+esc(UNIT[j.unit]||"")+'</div></div>'+
      '<span class="tag'+(a.status==="rejected"?" bad":a.status==="pending"?" n":"")+'">'+esc(STAT[a.status])+'</span></div>'+
      (a.status==="pending"?'<button class="link" data-act="withdraw" data-id="'+a.id+'">Tërhiq aplikimin</button>':'')+'</div>'; }).join("");
  el("acc").innerHTML=h;
}
async function postJob(btn){
  btn.disabled=true;
  var r=await db.from("jobs").insert({owner:me.id,job_role:el("jr").value,city:el("jc").value,job_type:el("jt").value,when_text:el("jw").value.trim(),pay:parseFloat(el("jp").value)||0,unit:el("ju").value,spots:parseInt(el("js").value,10)||1,student:el("jst").checked,urgent:el("jug").checked});
  btn.disabled=false;
  if(r.error){ msg(el("m3"),errText(r.error)); return; }
  renderAccount();
}

/* ---------- Ngjarjet ---------- */
document.addEventListener("submit",function(e){
  e.preventDefault(); var f=e.target, b=f.querySelector('button[type="submit"]');
  if(f.id==="fEmail") sendCode(el("em").value.trim(),b);
  else if(f.id==="fProf") saveProfile(b);
  else if(f.id==="fJob") postJob(b);
});
document.addEventListener("click",async function(e){
  var c=e.target.closest("[data-city]"); if(c){ fCity=c.getAttribute("data-city"); renderBoard(); return; }
  if(e.target.closest("[data-stu]")){ fStu=!fStu; renderBoard(); return; }
  if(e.target.closest("#home")){ e.preventDefault(); view="board"; render(); return; }
  var a=e.target.closest("[data-act]"); if(!a) return;
  var k=a.getAttribute("data-act"), id=a.getAttribute("data-id");
  if(k==="login") openLogin();
  else if(k==="close") el("dlg").close();
  else if(k==="logout"){ me=null; await db.auth.signOut(); profile=null; view="board"; render(); }
  else if(k==="account"){ view="account"; render(); }
  else if(k==="board"){ view="board"; render(); }
  else if(k==="apply"){ a.disabled=true; await apply(id); }
  else if(k==="setapp"){ a.disabled=true; var r=await db.from("applications").update({status:a.getAttribute("data-st")}).eq("id",id); if(r.error) alertBox(errText(r.error)); renderAccount(); }
  else if(k==="withdraw"){ a.disabled=true; var r2=await db.from("applications").delete().eq("id",id); if(r2.error) alertBox(errText(r2.error)); renderAccount(); }
  else if(k==="deljob"){
    if(a.getAttribute("data-sure")!=="1"){ a.setAttribute("data-sure","1"); a.textContent="Shtyp prapë për ta fshirë"; return; }
    a.disabled=true; var r3=await db.from("jobs").delete().eq("id",id); if(r3.error) alertBox(errText(r3.error)); renderAccount(); }
});
boot().catch(function(e){ el("main").innerHTML='<div class="msg err">'+esc(errText(e))+'</div>'; });
</script></body></html>
