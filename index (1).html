function whenOk(j,td,tm,wk){
  if(fWhen==="all") return true;
  if(fWhen==="urg") return !!j.urgent;
  var d=j.work_date; if(!d) return false;
  var long=j.job_type!=="d";

  if(k==="navpost"){ goPost(); return; }
  if(k==="clearsearch"){ fQ=""; fCity="all"; showAll=false; if(el("hq")) el("hq").value=""; if(el("hc")) el("hc").value=""; renderBoard(); return; }
  if(k==="helpfaq"){ openHelp("faq"); return; }
  if(k==="helpprice"){ openHelp("faq"); var pd=document.querySelector("#hPane details"); if(pd) pd.open=true; return; }
  if(k==="gojobs"){ if(view!=="home"||editing){ goHome(); } setTimeout(toBoard,50); return; }
  if(k==="ntclose"){ el("notifDlg").close(); return; }
  if(k==="ntgo"){ el("notifDlg").close(); editing=false; view="account"; render(); toTop(); return; }
  if(k==="google"){ googleIn(a); return; }
  if(k==="editprof"){ if(!profile) return; editing=true; render(); toTop(); return; }
  if(k==="report"){ if(el("jobDlg").open) el("jobDlg").close(); openReport(id); return; }
  if(k==="save"){ toggleSave(id,a); return; }
  if(k==="logodel"){ removeLogo(); return; }
  if(k==="admlogo"){ a.disabled=true; var rl=await db.rpc("admin_clear_logo",{job:id}); if(rl.error) alertBox(errText(rl.error)); else { a.textContent="✓"; } return; }
  if(k==="delacc"){ openDelete(); return; }
  if(k==="delacc2"){ deleteAccount(a); return; }
  if(k==="admhide"||k==="admskip"){ a.disabled=true; var ra=await db.rpc(k==="admhide"?"admin_hide_job":"admin_dismiss_reports",{job:id}); if(ra.error) alertBox(errText(ra.error)); adminBox(); return; }
  if(k==="canceledit"){ editing=false; pendingApply=null; savePending(); render(); return; }
  if(k==="help") openHelp();
  else if(k==="helpclose") el("helpDlg").close();
  else if(k==="login") openLogin();
  else if(k==="close") el("dlg").close();
  else if(k==="logout"){ me=null; profile=null; myDet={}; myCon={}; myPhone=null; isAdmin=false; editing=false; SAVED={}; NOTIF=[]; NT_OK=false; TERMS_OK=true; view="home"; await db.auth.signOut(); render(); toTop(); }
  else if(k==="account"){ if(el("jobDlg").open) el("jobDlg").close(); editing=false; view="account"; render(); toTop(); }
  else if(k==="home") goHome();
  else if(k==="more"){ showAll=true; renderBoard(); }
  else if(k==="apply"){ a.disabled=true; var fromJd=a.hasAttribute("data-jd"); if(fromJd) el("jobDlg").close(); await apply(id); if(fromJd&&view==="home"&&MINE[id]) openJob(id,true); }
  else if(k==="setapp"){ a.disabled=true; var r=await db.from("applications").update({status:a.getAttribute("data-st")}).eq("id",id); if(r.error) alertBox(errText(r.error)); renderAccount(); }
  else if(k==="withdraw"){ a.disabled=true; var r2=await db.from("applications").delete().eq("id",id); if(r2.error) alertBox(errText(r2.error)); renderAccount(); }
  else if(k==="review") openReview(a.getAttribute("data-job"),a.getAttribute("data-target"),a.getAttribute("data-name"));
  else if(k==="deljob"){
    if(a.getAttribute("data-sure")!=="1"){ a.setAttribute("data-sure","1"); a.textContent=t("del2"); return; }
    a.disabled=true; var r3=await db.from("jobs").delete().eq("id",id); if(r3.error) alertBox(errText(r3.error)); renderAccount(); }
});
boot().catch(function(e){ el("main").innerHTML='<div class="msg err">'+esc(errText(e))+'</div>'; });
</script></body></html>
